<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Bounty Practice – stream-overlay</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@700&family=DM+Sans:opsz,wght@9..40,600;9..40,800&display=swap">
<style>
  /* Transparante overlay voor OBS: Browserbron, 420x150 */
  html,body{margin:0;background:transparent;font-family:"DM Sans",system-ui,sans-serif;color:#f4ece0}
  .o{display:flex;align-items:center;gap:14px;width:max-content;padding:12px 18px 12px 12px;border-radius:16px;background:rgba(14,10,9,.82);box-shadow:inset 0 0 0 1px rgba(244,236,224,.14)}
  .o img{width:72px;height:72px;border-radius:12px;image-rendering:pixelated}
  .o h1{margin:0 0 6px;font-size:20px;display:flex;align-items:baseline;gap:10px}
  .o h1 small{font:700 13px "Pixelify Sans";color:#ff3b30;transform:skewX(-8deg)}
  .s{display:flex;gap:16px}
  .s div{display:grid}
  .s b{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
  .s span{font-size:12px;color:#b3a291}
  .s .up b{color:#f0b44c}
  .flash b{animation:f 1s}
  @keyframes f{0%{color:#6ad46a;transform:scale(1.25)}100%{transform:none}}
  .err{font-size:14px;color:#ffb3a8}
</style>
</head>
<body>
<div class="o" id="o"><span class="err">Zet ?speler=JouwNaam achter de link.</span></div>
<script src="config.js"></script>
<script>
(async () => {
  const C = window.BP, q = new URLSearchParams(location.search), name = q.get("speler");
  if (!name) return;
  const H = { apikey: C.anonKey, Authorization: `Bearer ${C.anonKey}` };
  let prev = null;
  async function tick() {
    try {
      const r = await fetch(`${C.supabaseUrl}/rest/v1/bp_players?select=name,kills,deaths,best_streak,points&name=ilike.${encodeURIComponent(name)}`, { headers: H });
      const [p] = await r.json();
      if (!p) { document.getElementById("o").innerHTML = `<span class="err">Geen stats voor ${name.replace(/[<>&]/g, "")}.</span>`; return; }
      const kd = p.deaths ? (p.kills / p.deaths).toFixed(2).replace(".", ",") : p.kills;
      const nf = (n) => n.toLocaleString("nl-NL");
      const cls = (k) => prev && prev[k] !== p[k] ? "flash" : "";
      document.getElementById("o").innerHTML = `<img src="https://mc-heads.net/avatar/${encodeURIComponent(p.name)}/72" alt="">
        <div><h1>${p.name.replace(/[<>&]/g, "")} <small>BOUNTY PRACTICE</small></h1><div class="s">
        <div class="${cls("kills")}"><b>${nf(p.kills)}</b><span>Kills</span></div>
        <div><b>${kd}</b><span>K/D</span></div>
        <div class="${cls("best_streak")}"><b>${nf(p.best_streak)}</b><span>Beste streak</span></div>
        <div class="up ${cls("points")}"><b>${nf(p.points)}</b><span>Punten</span></div></div></div>`;
      prev = p;
    } catch {}
  }
  tick(); setInterval(tick, 15000);
})();
</script>
</body>
</html>
